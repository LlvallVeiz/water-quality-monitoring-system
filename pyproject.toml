[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "water-quality-monitoring-system"
version = "1.0.0"
description = "End-to-end river water-quality monitoring: sensor simulation, WQI (NSF & CCME), alerts, analysis, reports and dashboard"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "matplotlib>=3.8"]

[project.optional-dependencies]
dev = ["pytest>=8", "scipy>=1.11"]

[project.scripts]
wqm = "water_quality.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
